name: Frontend CD

# main 브랜치에 반영되거나 Actions 화면에서 수동 실행될 때 배포
on:
  push:
    branches:
      - main
  workflow_dispatch:

# GitHub OIDC 토큰 발급과 소스 코드 읽기에 필요한 최소 권한
# AWS Access Key를 GitHub에 저장하지 않고 IAM Role을 임시로 Assume
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # GitHub 레포의 소스 코드를 Runner에 내려받음
      - name: Check out source
        uses: actions/checkout@v4

      # pnpm-lock.yaml과 동일한 pnpm 버전 준비
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Vite 빌드에 사용할 Node.js와 pnpm 패키지 캐시를 설정
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # lockfile에 기록된 정확한 버전의 의존성을 설치.
      # lockfile과 package.json이 일치하지 않으면 배포를 중단
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # React/Vite 앱을 배포 가능한 정적 파일(dist/)로 빌드
      - name: Build
        run: pnpm run build

      # OIDC 신뢰 정책과 비교할 현재 Actions 실행 브랜치를 로그에 남깁니다.
      - name: Check deployment branch
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"

      - name: Check OIDC claims
        run: |
          token="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')"
          payload="$(echo "$token" | cut -d '.' -f2 | tr '_-' '/+' | base64 -d 2>/dev/null)"
          echo "$payload" | jq '{aud, sub, repository, ref}'

      # GitHub OIDC 토큰으로 AWS_ROLE_ARN 역할을 임시로 Assume
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 새 dist/ 파일을 프론트 전용 S3 버킷 루트에 동기화
      # --delete는 S3에만 남아 있는 이전 정적 파일을 제거
      - name: Upload static files to S3
        run: aws s3 sync dist/ s3://${{ vars.S3_BUCKET }}/ --delete

      # CloudFront의 기존 캐시를 비워 새 배포 파일이 즉시 제공되게 함
      - name: Invalidate CloudFront cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          --paths "/*"
